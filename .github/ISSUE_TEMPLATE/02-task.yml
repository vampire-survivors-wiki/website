name: 作業・タスク
description: PBIなどで決めた体験を実現するための具体的な作業を管理する
title: '[TASK] '
type: Task
body:
  - type: markdown
    attributes:
      value: >-
        **原則としてPBIの子Issueとして管理します。** 起票後に親PBIを開き、「Sub-issues」欄の「Add existing issue」からこのIssueを追加してください。フォーム本文にPBI番号を書くことと、GitHub上の親子リンクを設定することは別です。対応するPBIがまだ決まっていない場合は、先に作業Issueを起票して後から紐づけても構いません。
  - type: markdown
    attributes:
      value: 'PBIでは利用者に届ける価値や体験を管理し、Taskではそれを実現する具体的な作業を管理します。'
  - type: textarea
    id: purpose
    attributes:
      label: 作業の目的・Why
      description: なぜこの作業が必要なのか、どの課題やPBIに関係するのかを書いてください。
      placeholder: '...'
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 作業内容・対象範囲
      description: 対象ファイル、ページ、機能、実施する作業を分かる範囲で記載してください。
      placeholder: '- ...'
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 作業完了条件
      description: 作業が完了したと判断できる条件を書いてください。
      placeholder: "- ...が実装されている。\n- ...で確認できる。"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 検証方法
      description: 必要なビルド、CI、手動確認、スマートフォン表示確認などを書いてください。
      placeholder: "- npm run build\n- PC / スマートフォンで表示確認"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・参考資料
      description: 親PBIとの実際の紐づけは本文への番号記載ではなく、GitHubのSub-issues機能で設定してください。ここには関連Issueや参考資料を記載します。
      placeholder: "関連Issue: #...\n参考URL: ..."
    validations:
      required: false
