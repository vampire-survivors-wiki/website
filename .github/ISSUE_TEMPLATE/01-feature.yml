name: 機能提案・改善（PBI候補）
description: 利用者に届けたい体験がまだ整理できていない機能提案や改善案を相談する
title: '[FEATURE] '
type: Feature
body:
  - type: markdown
    attributes:
      value: >-
        既存PBIの範囲に属する提案であれば、起票後に親PBIの「Sub-issues」欄から「Add existing issue」でこのIssueを子Issueとして追加してください。新しい利用者価値の候補で、対応するPBIがまだない場合は、無理に親を指定せず、内容を整理してPBI化する段階で親子関係を設定してください。
  - type: markdown
    attributes:
      value: '利用者・目的・望む体験がある程度整理できている場合は「PBI」を使用してください。このフォームは、まだPBIとして具体化できていないアイデアや改善の相談に使用します。'
  - type: textarea
    id: background
    attributes:
      label: 背景・解決したい問題
      description: 現状の何が問題なのか、どのような場面で困るのかを書いてください。
      placeholder: '現在は...のため、利用者が...しにくい。'
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期待する状態・利用者にとっての価値
      description: 変更後に利用者が何をできるようになるか、どのような体験になるとよいかを書いてください。
      placeholder: '利用者が...できるようになる。'
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 要件・受け入れ条件（任意）
      description: 現時点で決まっている条件があれば記載してください。未確定でも起票できます。
      placeholder: "- ...の場合に...と表示される。\n- PCとスマートフォンの両方で...できる。"
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 対象範囲・対象外
      description: 対象となるページや機能、今回扱わないこと、制約などを記載してください。
      placeholder: "対象: ...\n対象外: ..."
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 参考資料・関連Issue
      description: 参考サイト、デザイン、画像、関連Issueなどがあれば記載してください。
      placeholder: '- URL: ...'
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足・未確定事項
      description: その他の検討事項や未確定事項があれば記載してください。
    validations:
      required: false
