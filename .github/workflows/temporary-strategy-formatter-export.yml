name: Temporary strategy formatter export

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/components/strategy/**'
      - '.github/workflows/temporary-strategy-formatter-export.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export exact Prettier output
        run: |
          npx prettier --write src/components/strategy/StrategyDesktop.astro src/components/strategy/StrategyMobile.astro
          printf 'DESKTOP_BASE64='
          base64 -w0 src/components/strategy/StrategyDesktop.astro
          printf '\nMOBILE_BASE64='
          base64 -w0 src/components/strategy/StrategyMobile.astro
          printf '\n'
