name: Temporary PostHog formatting

on:
  push:
    branches:
      - posthog/wizard-01a1cd3c2efa

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format target files and remove this temporary workflow
        run: |
          npx prettier --write src/components/posthog.astro src/components/characters/CharactersMobile.astro
          rm .github/workflows/format-posthog-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/posthog.astro src/components/characters/CharactersMobile.astro .github/workflows/format-posthog-temp.yml
          git commit -m "style: format PostHog analytics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
