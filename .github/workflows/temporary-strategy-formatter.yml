name: Temporary strategy formatter

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/components/strategy/**'
      - '.github/workflows/temporary-strategy-formatter.yml'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format strategy components and print result
        run: |
          npx prettier --write src/components/strategy/StrategyDesktop.astro src/components/strategy/StrategyMobile.astro
          echo '=== StrategyDesktop.astro ==='
          cat src/components/strategy/StrategyDesktop.astro
          echo '=== StrategyMobile.astro ==='
          cat src/components/strategy/StrategyMobile.astro
